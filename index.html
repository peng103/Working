<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算器 · 打工人版</title>
<style>
  :root{
    color-scheme: dark;
    --gold:#ffb703;
    --green:#06d6a0;
    --pink:#ef476f;
    --text:#e9ecf1;
    --muted:#8b93a3;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    padding:28px 16px 64px;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1100px 600px at 8% -10%, rgba(255,183,3,.13), transparent 60%),
      radial-gradient(900px 520px at 108% 4%, rgba(6,214,160,.11), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(239,71,111,.08), transparent 60%),
      #0b0d12;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---------- 头部 ---------- */
  .head{text-align:center;margin-bottom:22px;}
  .head h1{
    margin:0 0 8px;
    font-size:clamp(20px,4.6vw,26px);
    letter-spacing:1px;
    font-weight:800;
  }
  .head h1 span{
    background:linear-gradient(120deg,#fff,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .head .sub{margin:0;color:var(--muted);font-size:13px;letter-spacing:.4px;}

  /* ---------- 卡片通用 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 20px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 12px 34px rgba(0,0,0,.28);
  }
  .card-title{
    font-size:12px;color:var(--muted);letter-spacing:1.4px;
    margin-bottom:14px;text-transform:uppercase;
  }

  /* ---------- 设置区 ---------- */
  .setup{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:14px;
    margin-bottom:16px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;color:var(--muted);letter-spacing:.6px;}
  .field input{
    width:100%;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    padding:10px 12px;
    color:#fff;
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, background .2s, box-shadow .2s;
  }
  .field input:focus{
    border-color:rgba(255,183,3,.65);
    background:rgba(255,255,255,.08);
    box-shadow:0 0 0 3px rgba(255,183,3,.12);
  }

  /* ---------- 主收益卡 ---------- */
  .hero{margin-bottom:16px;position:relative;overflow:hidden;}
  .hero::after{
    content:"";
    position:absolute;right:-60px;top:-80px;width:220px;height:220px;
    background:radial-gradient(circle,rgba(255,183,3,.22),transparent 68%);
    pointer-events:none;
  }
  .hero-head{display:flex;align-items:center;justify-content:space-between;}
  .hero-head .label{font-size:12px;color:var(--muted);letter-spacing:1.4px;}
  .pill{
    font-size:11.5px;padding:4px 11px;border-radius:999px;letter-spacing:.6px;
    background:rgba(6,214,160,.14);color:var(--green);
    border:1px solid rgba(6,214,160,.32);
    transition:.3s;
  }
  .pill.idle{background:rgba(139,147,163,.14);color:var(--muted);border-color:rgba(139,147,163,.3);}
  .pill.done{background:rgba(255,183,3,.15);color:var(--gold);border-color:rgba(255,183,3,.35);}

  .hero-num{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:clamp(38px,9.4vw,68px);
    font-weight:800;
    line-height:1.08;
    letter-spacing:-1.5px;
    margin:8px 0 16px;
    background:linear-gradient(120deg,#ffffff 8%,var(--gold) 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-num .symbol{
    font-size:.48em;
    -webkit-text-fill-color:var(--gold);
    color:var(--gold);
    margin-right:6px;
    letter-spacing:0;
  }

  .bar{
    height:10px;border-radius:999px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--green),var(--gold));
    box-shadow:0 0 18px rgba(255,183,3,.45);
    transition:width .28s linear;
  }
  .hero-meta{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;font-size:12.5px;color:var(--muted);
    font-family:var(--mono);font-variant-numeric:tabular-nums;
  }

  /* ---------- 双列区 ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:720px){ .grid{grid-template-columns:1fr;} }

  .rates{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .rate{
    background:rgba(255,255,255,.032);
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    padding:11px 13px;
  }
  .rate-k{font-size:11px;color:var(--muted);letter-spacing:.8px;}
  .rate-v{
    margin-top:5px;
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:16.5px;font-weight:700;color:#fff;
  }
  .rate-v.gold{color:var(--gold);}
  .rate-v.green{color:var(--green);}

  .cd{display:flex;flex-direction:column;gap:18px;}
  .cd-k{font-size:11px;color:var(--muted);letter-spacing:.8px;margin-bottom:5px;}
  .cd-v{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:clamp(24px,5vw,30px);
    font-weight:800;letter-spacing:1px;color:var(--green);
    line-height:1.1;
  }
  .cd-v.gold{color:var(--gold);}
  .cd-sub{font-size:12px;color:var(--muted);margin-top:5px;}

  /* ---------- 语录 ---------- */
  .quote{
    margin-top:24px;
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    min-height:22px;
    letter-spacing:.5px;
    transition:opacity .45s ease;
    line-height:1.7;
  }
  .quote::before{content:"「";opacity:.5;}
  .quote::after{content:"」";opacity:.5;}
  .foot{
    margin-top:10px;text-align:center;font-size:11.5px;color:rgba(139,147,163,.55);
  }

  /* ================= 木鱼 ================= */
  .muyu-panel{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:50;
    width:152px;
    padding:13px 12px 11px;
    border-radius:18px;
    text-align:center;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    background:rgba(20,23,30,.72);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 16px 40px rgba(0,0,0,.45);
    transition:border-color .3s, background .3s;
  }
  .muyu-panel:hover{
    border-color:rgba(255,183,3,.28);
    background:rgba(24,27,35,.8);
  }
  .muyu-gongde{
    display:flex;align-items:baseline;justify-content:center;gap:5px;
    margin-bottom:4px;
  }
  .gd-label{font-size:11px;color:var(--muted);letter-spacing:2px;}
  .gd-num{
    font-family:var(--mono);
    font-variant-numeric:tabular-nums;
    font-size:19px;font-weight:800;color:var(--gold);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1);
    display:inline-block;
  }
  .gd-num.bump{transform:scale(1.3);}
  .muyu-stage{
    position:relative;
    cursor:pointer;
    padding:2px 0 0;
    outline:none;
    transition:transform .1s ease;
  }
  .muyu-stage:active{transform:scale(.96);}
  .muyu-stage:focus-visible{
    box-shadow:0 0 0 2px rgba(255,183,3,.55);
    border-radius:12px;
  }
  .muyu-svg{
    display:block;width:100%;height:auto;
    overflow:visible;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));
  }
  .muyu-body{transform-box:fill-box;transform-origin:50% 100%;}
  .mallet{transform-box:fill-box;transform-origin:85% 15%;}
  .muyu-stage.hit .muyu-body{animation:muyuHit .3s cubic-bezier(.3,.9,.4,1);}
  .muyu-stage.hit .mallet{animation:malletHit .3s cubic-bezier(.3,.9,.4,1);}
  @keyframes muyuHit{
    0%{transform:scale(1,1);}
    32%{transform:scale(1.06,.93);}
    62%{transform:scale(.98,1.02);}
    100%{transform:scale(1,1);}
  }
  @keyframes malletHit{
    0%{transform:rotate(0deg);}
    32%{transform:rotate(-12deg);}
    66%{transform:rotate(4deg);}
    100%{transform:rotate(0deg);}
  }
  .muyu-tip{
    margin-top:2px;
    font-size:11px;
    color:rgba(139,147,163,.7);
    letter-spacing:.8px;
  }
  .muyu-pop{
    position:absolute;
    font-family:var(--mono);
    font-size:14px;font-weight:800;
    color:var(--gold);
    text-shadow:0 0 12px rgba(255,183,3,.65);
    white-space:nowrap;
    pointer-events:none;
    animation:popUp .95s ease-out forwards;
  }
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,0) scale(.6);}
    18%{opacity:1;transform:translate(calc(-50% + var(--dx,0px)),-15px) scale(1.12);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-66px) scale(.92);}
  }

  @media (max-width:600px){
    .muyu-panel{
      right:12px;bottom:12px;
      width:112px;padding:9px 8px 8px;border-radius:15px;
    }
    .gd-num{font-size:16px;}
    .muyu-tip{font-size:10px;}
    .muyu-pop{font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <h1>🐴 <span>牛马打工人专属计算器</span></h1>
    <p class="sub">把上班，换算成看得见的钱</p>
  </header>

  <!-- 参数设置 -->
  <section class="card setup">
    <div class="field">
      <label for="inSalary">月薪（元）</label>
      <input id="inSalary" type="number" min="0" step="100" inputmode="decimal">
    </div>
    <div class="field">
      <label for="inStart">上班时间</label>
      <input id="inStart" type="time">
    </div>
    <div class="field">
      <label for="inEnd">下班时间</label>
      <input id="inEnd" type="time">
    </div>
    <div class="field">
      <label for="inDays">每月工作天数</label>
      <input id="inDays" type="number" min="1" max="31" step="0.25" inputmode="decimal">
    </div>
    <div class="field">
      <label for="inPayday">发薪日（几号）</label>
      <input id="inPayday" type="number" min="1" max="31" step="1" inputmode="numeric">
    </div>
  </section>

  <!-- 今日已赚 -->
  <section class="card hero">
    <div class="hero-head">
      <span class="label">今日已赚</span>
      <span class="pill" id="status">搬砖中</span>
    </div>
    <div class="hero-num">
      <span class="symbol">¥</span><span id="todayEarn">0.000</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="hero-meta">
      <span id="progressText">完成进度 0.0%</span>
      <span id="dayTarget">今日目标 ¥0.00</span>
    </div>
  </section>

  <!-- 明细 -->
  <div class="grid">
    <section class="card">
      <div class="card-title">收入速率</div>
      <div class="rates">
        <div class="rate">
          <div class="rate-k">每秒</div>
          <div class="rate-v gold" id="perSec">¥0.0000</div>
        </div>
        <div class="rate">
          <div class="rate-k">每分钟</div>
          <div class="rate-v gold" id="perMin">¥0.00</div>
        </div>
        <div class="rate">
          <div class="rate-k">每小时</div>
          <div class="rate-v green" id="perHour">¥0.00</div>
        </div>
        <div class="rate">
          <div class="rate-k">每天</div>
          <div class="rate-v green" id="perDay">¥0.00</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">倒计时</div>
      <div class="cd">
        <div>
          <div class="cd-k" id="offWorkLabel">距离下班</div>
          <div class="cd-v" id="offWork">--:--:--</div>
        </div>
        <div>
          <div class="cd-k">距离发薪日</div>
          <div class="cd-v gold" id="paydayCd">-- 天</div>
          <div class="cd-sub" id="paydaySub">发薪日：--</div>
        </div>
      </div>
    </section>
  </div>

  <div class="quote" id="quote">钱在到账，别慌。</div>
  <div class="foot">彭</div>

</div>

<!-- ================= 木鱼 ================= -->
<div class="muyu-panel">
  <div class="muyu-gongde">
    <span class="gd-label">功德</span>
    <span class="gd-num" id="gongdeNum">0</span>
  </div>

  <div class="muyu-stage" id="muyuStage" tabindex="0" role="button" aria-label="敲木鱼，功德加一">
    <svg class="muyu-svg" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="muyuWoodGrad" cx="34%" cy="26%" r="82%">
          <stop offset="0%" stop-color="#d97a44"/>
          <stop offset="48%" stop-color="#a04a22"/>
          <stop offset="100%" stop-color="#57210c"/>
        </radialGradient>
        <linearGradient id="muyuMalletGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e0ab72"/>
          <stop offset="100%" stop-color="#8a5a30"/>
        </linearGradient>
      </defs>

      <!-- 地面阴影 -->
      <ellipse cx="60" cy="108" rx="38" ry="6" fill="rgba(0,0,0,.4)"/>

      <g class="muyu-body">
        <!-- 顶部手柄 -->
        <ellipse cx="60" cy="40" rx="11" ry="8" fill="#7d3517"/>
        <ellipse cx="60" cy="38" rx="8" ry="6" fill="#a8502a"/>
        <!-- 主体 -->
        <ellipse cx="60" cy="72" rx="43" ry="35" fill="url(#muyuWoodGrad)"/>
        <!-- 开口槽 -->
        <path d="M23 76 Q60 97 97 76 Q60 89 23 76 Z" fill="#2b0f04"/>
        <path d="M23 76 Q60 97 97 76" fill="none" stroke="#c4693a" stroke-width="1.6" opacity=".55"/>
        <!-- 鱼尾纹 -->
        <path d="M90 60 Q102 66 97 82" fill="none" stroke="#6b2a10" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M86 56 Q97 61 93 74" fill="none" stroke="#6b2a10" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
        <!-- 高光 -->
        <ellipse cx="43" cy="56" rx="15" ry="9" fill="rgba(255,255,255,.16)" transform="rotate(-22 43 56)"/>
        <ellipse cx="38" cy="50" rx="6" ry="3.5" fill="rgba(255,255,255,.25)" transform="rotate(-22 38 50)"/>
      </g>

      <!-- 木槌 -->
      <g class="mallet">
        <rect x="88" y="6" width="6.5" height="42" rx="3.2"
              fill="url(#muyuMalletGrad)" transform="rotate(35 91 27)"/>
        <circle cx="82" cy="46" r="10.5" fill="#6f4220"/>
        <circle cx="82" cy="46" r="10.5" fill="none" stroke="#8a5a30" stroke-width="1.4"/>
        <circle cx="78.5" cy="42.5" r="3.6" fill="rgba(255,255,255,.2)"/>
      </g>
    </svg>
  </div>

  <div class="muyu-tip">点一下 · 功德+1</div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var STORE_KEY = 'niuma-cfg-v1';
  var DEFAULTS = { salary: 8000, start: '09:00', end: '18:00', days: 21.75, payday: 15 };

  /* ---------------- 配置读写 ---------------- */
  var cfg = Object.assign({}, DEFAULTS);
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved) cfg = Object.assign(cfg, saved);
  } catch (e) { /* ignore */ }

  var els = {
    salary: $('inSalary'),
    start:  $('inStart'),
    end:    $('inEnd'),
    days:   $('inDays'),
    payday: $('inPayday')
  };

  function syncInputs() {
    els.salary.value = cfg.salary;
    els.start.value  = cfg.start;
    els.end.value    = cfg.end;
    els.days.value   = cfg.days;
    els.payday.value = cfg.payday;
  }

  function readInputs() {
    var salary = parseFloat(els.salary.value);
    cfg.salary = (isFinite(salary) && salary >= 0) ? salary : 0;

    cfg.start = els.start.value || DEFAULTS.start;
    cfg.end   = els.end.value   || DEFAULTS.end;

    var days = parseFloat(els.days.value);
    cfg.days = (isFinite(days) && days > 0) ? days : DEFAULTS.days;

    var pd = parseInt(els.payday.value, 10);
    cfg.payday = (isFinite(pd) && pd >= 1 && pd <= 31) ? pd : DEFAULTS.payday;

    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {}
    render();
  }

  Object.keys(els).forEach(function (k) {
    els[k].addEventListener('input', readInputs);
    els[k].addEventListener('change', readInputs);
  });

  /* ---------------- 工具函数 ---------------- */
  function hmToSec(t) {
    var parts = String(t).split(':');
    var h = parseInt(parts[0], 10) || 0;
    var m = parseInt(parts[1], 10) || 0;
    return h * 3600 + m * 60;
  }

  function fmtHMS(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  /* ---------------- 核心计算 ---------------- */
  function calc() {
    var now = new Date();
    var curSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

    var startSec = hmToSec(cfg.start);
    var endSec   = hmToSec(cfg.end);
    var overnight = endSec <= startSec;
    if (overnight) endSec += 86400;

    var cur = curSec;
    if (overnight && cur < startSec) cur += 86400;

    var dur    = endSec - startSec;
    var before = cur < startSec;
    var after  = cur >= endSec;
    var worked = Math.min(Math.max(cur - startSec, 0), dur);

    var hoursPerDay = dur / 3600;
    var hourly  = (cfg.days > 0 && hoursPerDay > 0) ? cfg.salary / (cfg.days * hoursPerDay) : 0;
    var perSec  = hourly / 3600;
    var perMin  = hourly / 60;
    var perDay  = hourly * hoursPerDay;

    return {
      now: now,
      cur: cur, curSec: curSec,
      startSec: startSec, endSec: endSec,
      dur: dur, worked: worked,
      before: before, after: after,
      hourly: hourly, perSec: perSec, perMin: perMin, perDay: perDay
    };
  }

  /* ---------------- 发薪日 ---------------- */
  function paydayInfo(day) {
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth(), d0 = now.getDate();
    var today = new Date(y, m, d0);

    var target = new Date(y, m, Math.min(day, daysInMonth(y, m)));
    if (target.getDate() < d0) {
      target = new Date(y, m + 1, Math.min(day, daysInMonth(y, m + 1)));
    }
    var diff = Math.round((target - today) / 86400000);
    return {
      days: diff,
      dateStr: (target.getMonth() + 1) + '月' + target.getDate() + '日'
    };
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var c = calc();
    var earned = c.worked * c.perSec;

    $('todayEarn').textContent = earned.toFixed(3);
    $('perSec').textContent  = '¥' + c.perSec.toFixed(4);
    $('perMin').textContent  = '¥' + c.perMin.toFixed(2);
    $('perHour').textContent = '¥' + c.hourly.toFixed(2);
    $('perDay').textContent  = '¥' + c.perDay.toFixed(2);
    $('dayTarget').textContent = '今日目标 ¥' + c.perDay.toFixed(2);

    var pct = c.dur > 0 ? Math.min(100, (c.worked / c.dur) * 100) : 0;
    $('barFill').style.width = pct.toFixed(2) + '%';
    $('progressText').textContent = '完成进度 ' + pct.toFixed(1) + '%';

    /* 状态标签 */
    var st = $('status');
    if (c.before) {
      st.textContent = '还没开工';
      st.className = 'pill idle';
    } else if (c.after) {
      st.textContent = '已下班 🎉';
      st.className = 'pill done';
    } else {
      st.textContent = '搬砖中';
      st.className = 'pill';
    }

    /* 下班倒计时 */
    var label = $('offWorkLabel');
    var val = $('offWork');
    if (c.before) {
      label.textContent = '距离上班';
      val.textContent = fmtHMS(c.startSec - c.curSec);
      val.classList.remove('gold');
    } else if (c.after) {
      label.textContent = '今日工时';
      val.textContent = '已收工';
      val.classList.add('gold');
    } else {
      label.textContent = '距离下班';
      val.textContent = fmtHMS(c.endSec - c.cur);
      val.classList.remove('gold');
    }

    /* 发薪日 */
    var p = paydayInfo(cfg.payday);
    $('paydayCd').textContent = p.days === 0 ? '就是今天 🎉' : (p.days + ' 天');
    $('paydaySub').textContent = '发薪日：' + p.dateStr;
  }

  /* ---------------- 语录轮播 ---------------- */
  var QUOTES = [
    '钱在到账，别慌。',
    '你不是在加班，你是在给未来充值。',
    '每一秒都有价格，别把它免费送人。',
    '把时间换算成钱，是成年人最清醒的浪漫。',
    '内耗不产生收益，干活才产生收益。',
    '下班时间一到，请毫不犹豫地关电脑。',
    '老板画的饼不顶饱，到账的钱才顶饱。',
    '你赚的每一分钱，都在替你说话。',
    '工作只是生活的一部分，别让它占满全部。',
    '今天的每一秒，都在给明天的你打钱。'
  ];
  var qi = 0;
  var quoteEl = $('quote');

  function nextQuote() {
    quoteEl.style.opacity = '0';
    setTimeout(function () {
      qi = (qi + 1) % QUOTES.length;
      quoteEl.textContent = QUOTES[qi];
      quoteEl.style.opacity = '1';
    }, 420);
  }

  /* ================= 木鱼逻辑 ================= */
  var GD_KEY = 'niuma-gongde-v1';
  var gongde = parseInt(localStorage.getItem(GD_KEY) || '0', 10);
  if (!isFinite(gongde) || gongde < 0) gongde = 0;

  var gongdeNumEl = $('gongdeNum');
  var muyuStage   = $('muyuStage');
  var audioCtx    = null;

  gongdeNumEl.textContent = gongde;

  /* 木鱼音效：用 Web Audio 合成，无需外部文件 */
  function playKnock() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var t = audioCtx.currentTime;

      /* 主体“笃”声：快速下滑的三角波 */
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(780, t);
      osc.frequency.exponentialRampToValueAtTime(210, t + 0.09);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.19);

      /* 高频敲击质感 */
      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(1700, t);
      gain2.gain.setValueAtTime(0.05, t);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(t);
      osc2.stop(t + 0.04);
    } catch (err) { /* 静音失败不影响功能 */ }
  }

  /* 生成“功德+1”飘字 */
  function spawnPop(e) {
    var rect = muyuStage.getBoundingClientRect();
    var x, y;
    if (e && typeof e.clientX === 'number' && e.clientX) {
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
    } else {
      x = rect.width / 2;
      y = rect.height * 0.42;
    }

    var pop = document.createElement('span');
    pop.className = 'muyu-pop';
    pop.textContent = '功德+1';
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
    pop.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(0) + 'px');

    muyuStage.appendChild(pop);
    setTimeout(function () {
      if (pop.parentNode) pop.parentNode.removeChild(pop);
    }, 1000);
  }

  /* 敲击主流程 */
  function knock(e) {
    gongde += 1;
    try { localStorage.setItem(GD_KEY, String(gongde)); } catch (err) {}
    gongdeNumEl.textContent = gongde;

    /* 数字弹跳 */
    gongdeNumEl.classList.remove('bump');
    void gongdeNumEl.offsetWidth;
    gongdeNumEl.classList.add('bump');

    /* 木鱼 + 木槌动画 */
    muyuStage.classList.remove('hit');
    void muyuStage.offsetWidth;
    muyuStage.classList.add('hit');
    setTimeout(function () { muyuStage.classList.remove('hit'); }, 320);

    spawnPop(e);
    playKnock();
  }

  muyuStage.addEventListener('click', function (e) {
    knock(e);
  });

  /* 键盘无障碍：回车 / 空格也能敲 */
  muyuStage.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      knock(null);
    }
  });

  /* ---------------- 启动 ---------------- */
  syncInputs();
  render();
  setInterval(render, 100);
  setInterval(nextQuote, 7000);

})();
</script>
</body>
</html>
